[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "DJ", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"*/settings/*.py" = ["F403", "F405"]
"*/tests/*.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = [
    "core", "billing", "statutory", "employers", "employees", "attendance",
    "leave", "payroll", "calculators", "statutory_out", "discipline",
    "documents", "selfservice", "console", "reporting",
]

# CLAUDE.md and calculators/README.md both say "100% BRANCH coverage" on
# calculators/ — without this, --cov-fail-under=100 only ever measured LINE
# coverage, which an if/elif chain can satisfy while still never taking one
# of its branches. branch = true is what makes the number mean what it says.
[tool.coverage.run]
branch = true
