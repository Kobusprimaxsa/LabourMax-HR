[pytest]
DJANGO_SETTINGS_MODULE = labourmax.settings.dev
python_files = test_*.py
addopts = --strict-markers -q --basetemp=.pytest-tmp
testpaths = core billing statutory employers employees attendance leave payroll calculators statutory_out discipline documents selfservice console reporting
markers =
    golden: THE GOLDEN SET (D-283) - reproduces a figure a regulator published (a SARS or DEL worked example, computed figure or rate) on the figures the loaded version carries. `pytest -m golden` is what --golden-tests-passed asserts
    statute: a section's own arithmetic, transcribed where no worked example is published (D-150). NOT in the golden set
    isolation: cross-tenant data isolation
    audit: change history - what is recorded, and what must never be
    files: stored files - the scan gate, the audit trail, and what is refused
    statutory: effective-dated reference data, citations, and the staleness guard
