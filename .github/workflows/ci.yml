name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # The container's POSTGRES_USER is created as a SUPERUSER. It therefore
      # stays 'postgres' and is used only for setup: a superuser BYPASSES row
      # level security, so pointing the application at it would make the whole
      # isolation suite pass while protecting nothing. The first CI run proved
      # this - four tests failed, exactly as designed.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres-setup-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: labourmax.settings.dev
      DJANGO_SECRET_KEY: ci-only-key
      POSTGRES_DB: labourmax
      POSTGRES_USER: labourmax
      POSTGRES_PASSWORD: labourmax-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # Mirrors the local setup: the application owns its tables but holds no
      # superuser rights. Extensions go into template1 as well, because pytest
      # creates test_labourmax from that template and P2's exclusion constraints
      # need btree_gist there.
      - name: Create the application role, without superuser rights
        env:
          PGPASSWORD: postgres-setup-only
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE labourmax LOGIN PASSWORD 'labourmax-ci' CREATEDB;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE labourmax OWNER labourmax;"
          for db in template1 labourmax; do
            psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 -c \
              "CREATE EXTENSION IF NOT EXISTS citext;
               CREATE EXTENSION IF NOT EXISTS btree_gist;
               CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          done

      # Fail here, with one clear line, rather than fifteen tests down. Also
      # confirms the extensions landed and the role can actually connect.
      - name: Verify the database is wired up correctly
        run: python manage.py dbcheck

      - name: Lint
        run: ruff check .

      # ruff formats Python inside Markdown code blocks too, so CLAUDE.md and
      # docs/ are covered by this. Local runs use `ruff format .`; CI must only
      # check, never rewrite.
      - name: Format
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Tenant isolation - must never fail
        run: pytest -m isolation -v

      - name: Full test suite
        run: pytest

      # 100% branch coverage on calculators/ is non-negotiable (CLAUDE.md), but
      # coverage treats an empty measurement as an error, so the gate would fail
      # for the wrong reason until P7 puts code there. The guard removes itself
      # the moment the first calculator lands.
      - name: Calculator coverage must be total
        run: |
          if compgen -G "calculators/**/*.py" > /dev/null && \
             [ -n "$(find calculators -name '*.py' ! -name '__init__.py' -print -quit)" ]; then
            pytest --cov=calculators --cov-report=term-missing --cov-fail-under=100
          else
            echo "calculators/ holds no code yet - the coverage gate arrives with P7."
          fi
        shell: bash
