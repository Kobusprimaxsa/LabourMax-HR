name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # The container's POSTGRES_USER is created as a SUPERUSER. It therefore
      # stays 'postgres' and is used only for setup: a superuser BYPASSES row
      # level security, so pointing the application at it would make the whole
      # isolation suite pass while protecting nothing. The first CI run proved
      # this - four tests failed, exactly as designed.
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres-setup-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: labourmax.settings.dev
      DJANGO_SECRET_KEY: ci-only-key
      POSTGRES_DB: labourmax
      POSTGRES_USER: labourmax
      POSTGRES_PASSWORD: labourmax-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

      # Without a key every encrypted column refuses the write rather than
      # storing plaintext (D-77), so the whole suite dies inside the encryption
      # layer for a reason that has nothing to do with the code under test.
      # That is what happened across four commits while the same suite was green
      # locally, where setup-windows.ps1 had generated a key months earlier
      # (D-94).
      #
      # The key decodes to the ASCII string "CI-ONLY-NEVER-USE-IN-PRODUCTION!",
      # which is the whole point of writing it out rather than generating one
      # per run into $GITHUB_ENV. The generated version worked and was fragile:
      # it depended on step ordering, and anything that put a step needing the
      # key before the step producing it failed with a message about the key
      # rather than about the ordering. A literal cannot be got wrong.
      #
      # The usual objection to a committed key is that somebody copies it into a
      # production .env. Here the key SAYS SO when you decode it, and this one
      # protects an ephemeral database that is destroyed with the runner.
      FIELD_ENCRYPTION_KEY: Q0ktT05MWS1ORVZFUi1VU0UtSU4tUFJPRFVDVElPTiE=

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # Mirrors the local setup: the application owns its tables but holds no
      # superuser rights.
      #
      # Extensions are created here only in the application's own database, so
      # `manage.py dbcheck` can assert they are present. The TEST database gets
      # what it needs from migration operations instead (BtreeGistExtension in
      # statutory/0002) - pytest rebuilds test_labourmax from template1 on every
      # run, and an extension installed by hand into one database is how a
      # constraint comes to exist in development and be missing in production.
      - name: Create the application role, without superuser rights
        env:
          PGPASSWORD: postgres-setup-only
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE labourmax LOGIN PASSWORD 'labourmax-ci' CREATEDB;"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE labourmax OWNER labourmax;"
          psql -h localhost -U postgres -d labourmax -v ON_ERROR_STOP=1 -c \
            "CREATE EXTENSION IF NOT EXISTS citext;
             CREATE EXTENSION IF NOT EXISTS btree_gist;
             CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      # Fail here, with one clear line, rather than fifteen tests down. Also
      # confirms the extensions landed and the role can actually connect.
      - name: Verify the database is wired up correctly
        run: python manage.py dbcheck

      - name: Lint
        run: ruff check .

      # ruff formats Python inside Markdown code blocks too, so CLAUDE.md and
      # docs/ are covered by this. Local runs use `ruff format .`; CI must only
      # check, never rewrite.
      - name: Format
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      # The data commands below write into `labourmax` itself, not pytest's
      # test_labourmax, and "makemigrations --check" above only proves no
      # migration is MISSING - it never applies one. Nothing had ever put a
      # table into this database before this step.
      - name: Migrate
        run: python manage.py migrate

      # A guard that only runs when somebody remembers to run it is not a
      # guard. These run as management commands under AUTOCOMMIT, which is
      # exactly the path pytest's transaction wrapper hides (D-92): a command
      # that writes inside a context block without opening atomic() first
      # passes the whole suite and fails here.
      #
      # --all, never a shell glob: alphabetical order loads the rule set
      # fixtures before the sectors they reference and the loader refuses
      # them (D-75). --all is FIXTURE_ORDER, dependency order.
      - name: Load statutory reference data
        run: python manage.py loadstatutory --all

      - name: Seed the shared payroll component catalogue
        run: python manage.py seedcomponents

      - name: Seed the shared leave type and evidence catalogues
        run: python manage.py seedleavetypes

      # AFTER the loads: over an empty database every check iterates no rows
      # and would pass, so checkstatutory refuses instead (D-74) and this step
      # would fail for the wrong reason. Includes check_fixture_checksums()
      # (D-161), the standing form of the SHA-256 guard that otherwise only
      # fires on a reload.
      - name: Statutory reconciliation
        run: python manage.py checkstatutory

      - name: Tenant isolation - must never fail
        run: pytest -m isolation -v

      # The command --golden-tests-passed records (D-283), run on its own so a
      # verifier can point at this step. The 2 xfails are O-43 and are expected.
      - name: Golden set - what --golden-tests-passed asserts
        run: pytest -m golden -rxX

      - name: Full test suite
        run: pytest

      # 100% branch coverage on calculators/ is non-negotiable (CLAUDE.md), but
      # coverage treats an empty measurement as an error, so the gate would fail
      # for the wrong reason until P7 puts code there. The guard removes itself
      # the moment the first calculator lands.
      - name: Calculator coverage must be total
        run: |
          if compgen -G "calculators/**/*.py" > /dev/null && \
             [ -n "$(find calculators -name '*.py' ! -name '__init__.py' -print -quit)" ]; then
            pytest --cov=calculators --cov-report=term-missing --cov-fail-under=100
          else
            echo "calculators/ holds no code yet - the coverage gate arrives with P7."
          fi
        shell: bash
