name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: labourmax
          POSTGRES_USER: labourmax
          POSTGRES_PASSWORD: labourmax
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: labourmax.settings.dev
      DJANGO_SECRET_KEY: ci-only-key
      POSTGRES_DB: labourmax
      POSTGRES_USER: labourmax
      POSTGRES_PASSWORD: labourmax
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # ruff formats Python inside Markdown code blocks too, so CLAUDE.md and
      # docs/ are covered by this. Local runs use `ruff format .`; CI must only
      # check, never rewrite.
      - name: Format
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Tenant isolation - must never fail
        run: pytest -m isolation -v

      - name: Full test suite
        run: pytest

      # 100% branch coverage on calculators/ is non-negotiable (CLAUDE.md), but
      # coverage treats an empty measurement as an error, so the gate would fail
      # for the wrong reason until P7 puts code there. The guard removes itself
      # the moment the first calculator lands.
      - name: Calculator coverage must be total
        run: |
          if compgen -G "calculators/**/*.py" > /dev/null && \
             [ -n "$(find calculators -name '*.py' ! -name '__init__.py' -print -quit)" ]; then
            pytest --cov=calculators --cov-report=term-missing --cov-fail-under=100
          else
            echo "calculators/ holds no code yet - the coverage gate arrives with P7."
          fi
        shell: bash
